<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhino - Catch the Objects</title>
    <link rel="stylesheet" href="../src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Rhino Game</h1>
      </header>
      <main>
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
          <div class="score-display">
            <span>Score: <strong id="score">0</strong></span>
            <span>High Score: <strong id="highScore">0</strong></span>
          </div>
          <div class="controls">
            <p>Use <strong>A</strong> and <strong>D</strong> or <strong>Arrow Keys</strong> to move</p>
            <p>Press <strong>P</strong> to pause</p>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
